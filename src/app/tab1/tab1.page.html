<ion-header>
  <ion-toolbar>
    <ion-title>Add User</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-item>
    <ion-input placeholder="Name" [(ngModel)]="newUser.name"></ion-input>
  </ion-item>
  <ion-item>
    <ion-input placeholder="Email" [(ngModel)]="newUser.email"></ion-input>
  </ion-item>
  <ion-button expand="block" (click)="addUser()">Add User</ion-button>
</ion-content>
